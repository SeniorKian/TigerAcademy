services:
  postgres:
    image: postgres:17-alpine
    container_name: tigerapp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - tigerapp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  tigerapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tigerapp
    ports:
      - "5100:5100"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5100
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Timeout=5
      JwtSettings__Secret: ${TIGERAPP_JWT_SECRET:?Set TIGERAPP_JWT_SECRET in .env}
      Installation__LockFile: App_Data/installed.lock
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - tigerapp-state:/app/App_Data
      - tigerapp-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  tigerapp-postgres:
  tigerapp-state:
  tigerapp-logs:
